<p><strong>Símbolo:</strong> {{ simbolo }}</p>

<table>
    <caption>Propriedades do elemento {{ simbolo }}</caption>

    <tbody>
        {% for titulo, valor in propriedades.items() %}
            <tr>
                <th scope="row">{{ titulo }}</th>
                <td>{% if titulo == "Nome" %}{{ nome }}{% else %}{{ valor }}{% endif %}</td>
            </tr>
        {% endfor %}
    </tbody>
</table>
